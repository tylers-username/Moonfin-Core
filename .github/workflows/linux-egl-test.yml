name: Experimental Linux EGL Renderer (2.6.0)

# Isolated, x86_64-only test; no packaging for other platforms.
# The branch push starts the first build without requiring a workflow
# definition on the repository's default branch.
on:
  push:
    branches:
      - fix/linux-egl-renderer-2.6.0
    paths:
      - .github/workflows/linux-egl-test.yml
      - scripts/build-linux-egl-test.sh
      - patches/media-kit-video-linux-egl.patch
      - linux/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-egl:
    name: Build experimental Linux x86_64 bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - name: Checkout Moonfin 2.6.0 patch branch
        uses: actions/checkout@v4

      - name: Check 2.6.0 baseline
        run: |
          grep -Eq '^version: 2[.]6[.]0[+]' pubspec.yaml
          echo "Moonfin 2.6.0 baseline confirmed."

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libx11-dev libepoxy-dev \
            libwebkit2gtk-4.1-dev libmpv-dev libsecret-1-dev \
            libasound2-dev libarchive-dev

      - name: Install pinned Flutter SDK 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Compile with EGL patch (restores pub cache afterward)
        run: |
          bash scripts/build-linux-egl-test.sh

      - name: Bundle Moonfin runtime libraries (libmpv, etc.)
        run: |
          set -euo pipefail
          # Reuse the repository's tested Linux tarball packager. Never call
          # build-linux.sh directly here: that would rebuild without the patch.
          source ./build-linux.sh
          BUILD_DIR="$(resolve_build_dir)"
          # Print which bundled library needs a JVM if packaging rejects it.
          # This is diagnostic only: do not silence the dependency gate.
          if ! build_tarball; then
            echo "::group::Libraries with a direct DT_NEEDED dependency on libjvm.so"
            find "$GITHUB_WORKSPACE/build/linux/temp/tarball" -type f \\
              \( -name '*.so*' -o -name 'moonfin*' \) -print0 |
              while IFS= read -r -d '' f; do
                if readelf -d "$f" 2>/dev/null | grep -q 'Shared library: \\[libjvm.so\\]'; then
                  echo "REQUIRES_JVM: $f"
                  ldd "$f" 2>&1 | grep -E 'jvm|not found' || true
                fi
              done
            echo "::endgroup::"
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/Moonfin_Linux_v2.6.0.tar.gz"
          tar -tzf "$GITHUB_WORKSPACE/Moonfin_Linux_v2.6.0.tar.gz" | grep -E 'libmpv[.]so[.]2|moonfin-bin' | head -10
          ls -lh "$GITHUB_WORKSPACE/Moonfin_Linux_v2.6.0.tar.gz"
          {
            echo "## Experimental Moonfin Linux EGL build"
            echo
            echo "The packaged Linux tarball is attached as **moonfin-2.6-egl-linux-x86_64**."
            echo "It includes bundled libmpv and a wrapper that configures LD_LIBRARY_PATH."
            echo "Download, extract the ZIP then tarball, and run the moonfin wrapper."
            echo "This build is **experimental and not runtime-verified** (media-kit issue #1404)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: moonfin-2.6-egl-linux-x86_64
          path: Moonfin_Linux_v2.6.0.tar.gz
          if-no-files-found: error
          retention-days: 14
